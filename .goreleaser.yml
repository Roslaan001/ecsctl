# .goreleaser.yml
# Reference: https://goreleaser.com

version: 2

project_name: ecsctl

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/roslaan001/ecsctl/cmd.Version={{.Version}} -X github.com/roslaan001/ecsctl/cmd.Commit={{.ShortCommit}} -X github.com/roslaan001/ecsctl/cmd.BuildDate={{.CommitDate}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
