name: Bug report
description: Report an issue or unexpected behavior in ecsctl
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Before reporting, please check existing issues to see if it has already been reported.
        If this is a security vulnerability, please review our [Security Policy](https://github.com/Roslaan001/ecsctl/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what bug or unexpected behavior occurred.
      placeholder: Tell us what you saw!
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands run or steps to reproduce the issue.
      placeholder: |
        1. ecsctl apply -f ...
        2. ecsctl describe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ecsctl version
      description: Output of `ecsctl version`.
      placeholder: e.g. ecsctl version 0.5.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What OS are you running ecsctl on?
      options:
        - Linux (x86_64 / amd64)
        - Linux (arm64)
        - macOS (Apple Silicon / arm64)
        - macOS (Intel / amd64)
        - Windows (x86_64 / amd64)
        - Windows (arm64)
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or command output
      description: Any relevant terminal output or logs (scrub sensitive credentials/tokens).
      render: shell
