name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Run tests
        run: go test ./... -v -race -count=1

      - name: Verify no uncommitted changes
        run: git diff --exit-code

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0

  cross-build:
    name: Cross-build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Scan Go dependencies and reachable code
        uses: golang/govulncheck-action@v1.1.0

  floci-integration:
    name: Floci ECS integration
    runs-on: ubuntu-latest
    services:
      floci:
        image: floci/floci:2.1.0
        ports:
          - 4566:4566
        env:
          FLOCI_SERVICES_ECS_MOCK: "true"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Exercise ECS service lifecycle against Floci
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:4566
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_EC2_METADATA_DISABLED: "true"
        run: go test -tags=integration ./pkg/aws -run '^TestFlociECSServiceLifecycle$' -count=1 -v

  installer-smoke:
    name: Installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install and run the latest release (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          ECSCTL_INSTALL_DIR: ${{ runner.temp }}/ecsctl-bin
        run: |
          sh ./install.sh
          "$ECSCTL_INSTALL_DIR/ecsctl" version

      - name: Install and run the latest release (Windows)
        if: runner.os == 'Windows'
        env:
          ECSCTL_INSTALL_DIR: ${{ runner.temp }}/ecsctl-bin
        shell: pwsh
        run: |
          ./install.ps1
          & (Join-Path $env:ECSCTL_INSTALL_DIR 'ecsctl.exe') version
