name: PR metadata

on:
  pull_request:
    branches: [main, master]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  validate:
    name: Validate PR title and body
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7.0.1

      - name: Validate title and required description sections
        run: python3 scripts/validate-pull-request.py
